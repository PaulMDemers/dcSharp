name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore dcSharp.slnx

      - name: Build
        run: dotnet build dcSharp.slnx --no-restore

      - name: Validate fixture manifest
        run: dotnet run --no-build --project src\DcSharp.Cli -- fixtures fixtures\kos.json --validate-only

      - name: Test
        run: dotnet test dcSharp.slnx --no-build
